<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Victor Tools</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script src="vendor/jszip.min.js"></script>
  <script src="regroup.js"></script>
  <link rel="stylesheet" href="taskpane.css">
</head>
<body>
  <!-- One pane, no tabs: every button in sight, nothing to hunt for. -->
  <section>
    <h2>Selected picture</h2>
    <div class="row">
      <button id="invert" class="primary" title="Replace the selected picture with its negative: black ↔ white, every color flipped, transparency kept.">Invert</button>
      <button id="remove-bg" class="primary" title="Cut the background away (BiRefNet, on this Mac's GPU). The result is trimmed to the subject and stays where the subject was.">Remove background</button>
    </div>
  </section>

  <section>
    <h2>Animated group</h2>
    <button id="add-to-group" class="primary" title="Select an animated group plus the shapes to add to it. They join the group, which keeps its animation and its place in the order. The slide is rebuilt in place.">Add selection to animated group</button>
  </section>

  <section>
    <h2>Code block</h2>
    <textarea id="src" spellcheck="false" placeholder="Paste code here…"></textarea>
    <div class="row">
      <label>Language
        <select id="lang">
          <option value="java">Java</option>
          <option value="kotlin">Kotlin</option>
          <option value="typescript">TypeScript</option>
          <option value="javascript">JavaScript</option>
          <option value="python">Python</option>
          <option value="sql">SQL</option>
          <option value="xml">XML / HTML</option>
          <option value="yaml">YAML</option>
          <option value="json">JSON</option>
          <option value="bash">Bash</option>
          <option value="plaintext">Plain text</option>
        </select>
      </label>
      <label>Size <input id="size" type="number" min="8" max="40" value="16"></label>
      <label>Theme
        <select id="theme">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
      </label>
    </div>
    <button id="insert" class="primary">Insert on current slide</button>
  </section>

  <section>
    <h2>Text-heavy slides</h2>
    <button id="scan" class="primary" title="Rank the slides by word count. Click one to jump to it.">Scan deck</button>
    <ol id="ranking"></ol>
  </section>

  <p id="status"></p>
  <script src="taskpane.js"></script>
</body>
</html>
