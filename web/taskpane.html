<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Victor Tools</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script src="vendor/jszip.min.js"></script>
  <script src="regroup.js"></script>
  <script src="links.js"></script>
  <script src="crop.js"></script>
  <script src="vendor/pako.min.js"></script>
  <script src="vendor/UPNG.js"></script>
  <script src="dark.js"></script>
  <link rel="stylesheet" href="taskpane.css">
</head>
<body>
  <!-- One pane, no tabs: every button in sight, nothing to hunt for. Grouped by what they act on. -->
  <section>
    <h2>Selected picture</h2>
    <div class="row">
      <button id="invert" class="primary" title="Replace the selected picture with its negative: black ↔ white, every color flipped, transparency kept."><span class="icon">🎞️</span>Invert</button>
      <button id="remove-bg" class="primary" title="Cut the background away (BiRefNet, on this Mac's GPU). The result is trimmed to the subject and stays where the subject was."><span class="icon">✂️</span>Remove background</button>
    </div>
    <div class="row">
      <button id="remove-watermark" class="primary" title="Claude finds the watermark (stock-site text or logo, even partial fragments) and LaMa paints it out on this Mac's GPU; a second look catches what the first missed. ~20–40 s. The picture stays where it was."><span class="icon">🧽</span>Remove watermark</button>
      <button id="crop-border" class="primary" title="Cut off the useless border: the flat band of transparent, white, black or any one color around the picture, each side on its own. What's left stays exactly where it was on the slide."><span class="icon">🖼️</span>Crop border</button>
    </div>
  </section>

  <section>
    <h2>Selected slides</h2>
    <div class="row">
      <button id="dark" class="primary" title="Turn the selected slides dark, or dark ones light: the background flips, text keeps the contrast it had against what is behind it, pastel fills and highlights become deep tints (yellow turns amber), line art and light screenshots are flipped, photos stay. Click again to get the slide back exactly as it was. Each slide is rebuilt in place."><span class="icon">🌗</span>Dark ↔ light</button>
      <button id="underline-links" class="primary" title="Every hyperlink on the selected slides turns bold and gets a blue underline (theme color Text 2; a lighter blue on a dark slide), keeping its own text color and font. Select several slides in the thumbnails to do them all. Each changed slide is rebuilt in place."><span class="icon">🔗</span>Bold blue links</button>
    </div>
  </section>

  <section>
    <h2>Selected shapes</h2>
    <button id="add-to-group" class="primary" title="Select an animated group plus the shapes to add to it. They join the group, which keeps its animation and its place in the order. The slide is rebuilt in place."><span class="icon">🧩</span>Add selection to animated group</button>
  </section>

  <section>
    <h2>Current slide</h2>
    <textarea id="src" spellcheck="false" placeholder="Paste code here…"></textarea>
    <div class="row">
      <label>Language
        <select id="lang">
          <option value="java">Java</option>
          <option value="kotlin">Kotlin</option>
          <option value="typescript">TypeScript</option>
          <option value="javascript">JavaScript</option>
          <option value="python">Python</option>
          <option value="sql">SQL</option>
          <option value="xml">XML / HTML</option>
          <option value="yaml">YAML</option>
          <option value="json">JSON</option>
          <option value="bash">Bash</option>
          <option value="plaintext">Plain text</option>
        </select>
      </label>
      <label>Size <input id="size" type="number" min="8" max="40" value="16"></label>
      <label>Theme
        <select id="theme">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
      </label>
    </div>
    <button id="insert" class="primary" title="Insert the code above on the current slide as a syntax-highlighted JetBrains Mono text box (VS Code Dark+ / Light+ colors)."><span class="icon">💻</span>Insert code block</button>
  </section>

  <p id="status"></p>
  <script src="taskpane.js"></script>
</body>
</html>
