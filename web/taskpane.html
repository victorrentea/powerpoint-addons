<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Victor Tools</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <link rel="stylesheet" href="taskpane.css">
</head>
<body>
  <nav>
    <button class="tab active" data-tab="code">Code block</button>
    <button class="tab" data-tab="stats">Text-heavy slides</button>
  </nav>

  <section id="code" class="panel active">
    <label>Language
      <select id="lang">
        <option value="java">Java</option>
        <option value="kotlin">Kotlin</option>
        <option value="typescript">TypeScript</option>
        <option value="javascript">JavaScript</option>
        <option value="python">Python</option>
        <option value="sql">SQL</option>
        <option value="xml">XML / HTML</option>
        <option value="yaml">YAML</option>
        <option value="json">JSON</option>
        <option value="bash">Bash</option>
        <option value="plaintext">Plain text</option>
      </select>
    </label>
    <textarea id="src" spellcheck="false" placeholder="Paste code here…"></textarea>
    <div class="row">
      <label>Size <input id="size" type="number" min="8" max="40" value="16"></label>
      <label>Theme
        <select id="theme">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
      </label>
    </div>
    <button id="insert" class="primary">Insert on current slide</button>
  </section>

  <section id="stats" class="panel">
    <p class="hint">Slides ranked by word count. Click one to jump to it.</p>
    <button id="scan" class="primary">Scan deck</button>
    <ol id="ranking"></ol>
  </section>

  <p id="status"></p>
  <script src="taskpane.js"></script>
</body>
</html>
